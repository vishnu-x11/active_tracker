name: active_tracker
description: "Active Health Fitness Tracker • Gym Training • BMI Calculator • Daily Log"

publish_to: 'none'

version: 3.2.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # ============ STATE MANAGEMENT & ROUTING ============
  get: ^4.6.5

  # ============ LOCAL STORAGE ============
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.0
  sqlite3: ^3.0.0
  path: ^1.8.3

  # ============ FIREBASE & CLOUD ============
  firebase_core: ^3.1.1
  cloud_firestore: ^5.0.2
  firebase_auth: ^5.1.1

  # ============ MODELS & SERIALIZATION ============
  json_annotation: ^4.8.1

  # ============ UI & UX ============
  flutter_svg: ^2.0.7
  intl: ^0.19.0
  table_calendar: ^3.0.9
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  fl_chart: ^0.68.0
  pdf: ^3.10.0
  flutter_otp_text_field: ^1.1.1

  # ============ UTILITIES & PLATFORM ============
  connectivity_plus: ^5.0.0
  permission_handler: ^12.0.1
  cupertino_icons: ^1.0.2
  google_sign_in: ^6.2.1
  tflite_flutter: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ============ CODE GENERATION ============
  build_runner: ^2.4.6
  hive_generator: ^2.0.0
  json_serializable: ^6.7.0

  # ============ LINTING & ANALYSIS ============
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/