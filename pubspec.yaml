name: active_tracker
description: "Active Health Fitness Tracker • Gym Training • BMI Calculator • Daily Log"

publish_to: 'none'

version: 3.2.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State and navigation
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0

  # Local data
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1 # finds the old app's Hive files to remove on first launch
  uuid: ^4.6.0

  # Firebase: sign-in and sync
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.0.2
  connectivity_plus: ^5.0.0 # syncs when the connection comes back

  # GPS runs
  geolocator: ^14.0.2
  flutter_map: ^8.3.2 # OpenStreetMap tiles, no API key
  latlong2: ^0.10.1

  # UI
  intl: ^0.19.0
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  flutter_tts: ^4.2.5
  share_plus: ^13.3.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^2.0.0
  sqflite_common_ffi: ^2.4.5
  fake_async: ^1.3.0

hooks:
  user_defines:
    sqlite3:
      source: system

flutter:
  uses-material-design: true

  # Inter, bundled (no download at start-up). Licence: assets/fonts/LICENSE.txt (SIL OFL 1.1).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
