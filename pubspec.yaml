name: active_health
description: "Fitness Tracker • Gym Training • BMI Calculator • Daily Log"

publish_to: 'none'

version: 3.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # ============ STATE MANAGEMENT & ROUTING ============

  get: ^4.6.5              # GetX - state management + routing + DI

  # ============ LOCAL STORAGE ============

  hive: ^2.2.3             # Key-value storage for Hive boxes
  hive_flutter: ^1.1.0     # Hive for Flutter
  isar: ^3.1.0             # SQLite-based Isar database

  # ============ MODELS============

  json_annotation: ^4.8.1      # JSON annotations

  # ============ UI & UX ============

  flutter_svg: ^2.0.7          # SVG rendering
  intl: ^0.19.0                # Internationalization (date formatting)
  table_calendar: ^3.0.9        # Calendar widget for history view
  share_plus: ^7.2.1            # Native share sheet for export
  path_provider: ^2.1.1         # App document directory access

  # ============ UTILITIES & PLATFORM ============

  connectivity_plus: ^5.0.0     # Network connectivity detection
  permission_handler: ^12.0.1    # Runtime permissions (camera, storage)
  cupertino_icons: ^1.0.2       # iOS default icons

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ============ CODE GENERATION ============

  build_runner: ^2.4.6          # Code generation runner
  hive_generator: ^2.0.0        # Hive adapter generator
  isar_generator: ^3.1.0        # Isar collection generator
  json_serializable: ^6.7.0     # (also in dev_dependencies)

  # ============ LINTING & ANALYSIS ============

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # Add assets here when needed
  assets:
  # - assets/images/
  # - assets/icons/
  # - assets/data/

  # Add fonts here when needed
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
  #       - asset: assets/fonts/CustomFont-Bold.ttf
  #         weight: 700