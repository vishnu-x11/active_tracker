include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/core/firebase/firebase_options.dart  # generated by flutterfire
    - android/**
    - ios/**
    - web/**
    - build/**
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # A missing const is treated as an error: const widgets are skipped on rebuild (plan section 4a).
    prefer_const_constructors: error
    prefer_const_literals_to_create_immutables: error
    prefer_const_declarations: error

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_final_fields
    - avoid_print
    - always_declare_return_types
    - avoid_dynamic_calls
    - unawaited_futures
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - use_key_in_widget_constructors
    - avoid_unnecessary_containers
    - sized_box_for_whitespace
